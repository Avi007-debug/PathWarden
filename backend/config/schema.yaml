# PathWarden Normalized ECS-aligned Event Schema
version: "5.1"
fields:
  event_id:
    type: string
    required: true
    description: "Unique surrogate key for normalized event"
  timestamp:
    type: datetime
    required: true
    description: "UTC normalized ISO 8601 timestamp"
  event_type:
    type: string
    required: true
    allowed_values: ["PROCESS_CREATE", "NETWORK_CONNECT", "FILE_MODIFY", "AUTH_LOGIN", "REGISTRY_SET"]
  source_format:
    type: string
    required: true
  host:
    name: { type: string, required: true }
    ip: { type: string, required: false }
    os: { type: string, required: false }
  user:
    name: { type: string, required: true }
    domain: { type: string, required: false }
    sid: { type: string, required: false }
  process:
    name: { type: string, required: false }
    pid: { type: integer, required: false }
    parent_pid: { type: integer, required: false }
    command_line: { type: string, required: false }
    hash_sha256: { type: string, required: false }
  network:
    src_ip: { type: string, required: false }
    dest_ip: { type: string, required: false }
    dest_port: { type: integer, required: false }
    protocol: { type: string, required: false }

