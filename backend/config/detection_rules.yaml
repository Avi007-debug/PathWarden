# PathWarden Detection Rules
rules:
  - rule_id: "RULE-T1003-001"
    technique_id: "T1003.001"
    technique_name: "OS Credential Dumping: LSASS Memory"
    severity: "CRITICAL"
    tactic: "CREDENTIAL_ACCESS"
    query: "SELECT * FROM events WHERE process_name LIKE '%mimikatz%' OR command_line LIKE '%sekurlsa::logonpasswords%'"
  - rule_id: "RULE-T1059-001"
    technique_id: "T1059.001"
    technique_name: "Command and Scripting Interpreter: PowerShell"
    severity: "HIGH"
    tactic: "EXECUTION"
    query: "SELECT * FROM events WHERE process_name LIKE '%powershell.exe%' AND command_line LIKE '%-enc%'"
  - rule_id: "RULE-T1550-002"
    technique_id: "T1550.002"
    technique_name: "Use Alternate Authentication: Pass the Hash"
    severity: "CRITICAL"
    tactic: "LATERAL_MOVEMENT"
    query: "SELECT * FROM events WHERE event_type = 'AUTH_LOGIN' AND auth_package = 'NTLM'"

