# PathWarden Detection Rules
rules:
  - rule_id: "RULE-T1110-001"
    rule_name: "Brute Force Burst"
    rule_version: "1.0.0"
    technique_id: "T1110.001"
    technique_name: "Password Guessing"
    severity: "HIGH"
    tactic: "Credential Access"
    description: "High volume of failed authentications or denied connections from a single source IP."
    query: "SELECT src_ip, count(*) as failure_count, list(event_uid) as event_uids, min(event_uid) as primary_event_uid, min(event_ts) as start_ts, max(event_ts) as end_ts FROM events WHERE outcome = 'FAILURE' OR action = 'DENY' GROUP BY src_ip HAVING count(*) >= 20"

  - rule_id: "RULE-T1046-001"
    rule_name: "Network Service Discovery / Port Scan"
    rule_version: "1.0.0"
    technique_id: "T1046"
    technique_name: "Network Service Discovery"
    severity: "MEDIUM"
    tactic: "Discovery"
    description: "Single source contacting numerous distinct destination ports."
    query: "SELECT src_ip, dst_ip, count(DISTINCT dst_port) as distinct_ports, list(event_uid) as event_uids, min(event_uid) as primary_event_uid FROM events WHERE dst_port IS NOT NULL GROUP BY src_ip, dst_ip HAVING count(DISTINCT dst_port) >= 10"

  - rule_id: "RULE-T1110-004"
    rule_name: "Credential Stuffing"
    rule_version: "1.0.0"
    technique_id: "T1110.004"
    technique_name: "Credential Stuffing"
    severity: "HIGH"
    tactic: "Credential Access"
    description: "Repeated authentication failures across distinct user accounts."
    query: "SELECT src_ip, count(DISTINCT user_name) as distinct_users, count(*) as attempt_count, list(event_uid) as event_uids, min(event_uid) as primary_event_uid FROM events WHERE outcome = 'FAILURE' AND user_name IS NOT NULL GROUP BY src_ip HAVING count(DISTINCT user_name) >= 3"

  - rule_id: "RULE-T1071-001"
    rule_name: "C2 Web Beaconing"
    rule_version: "1.0.0"
    technique_id: "T1071.001"
    technique_name: "Web Protocols"
    severity: "HIGH"
    tactic: "Command and Control"
    description: "Repetitive outbound connections to external destination IP over HTTP/HTTPS."
    query: "SELECT src_ip, dst_ip, dst_port, count(*) as beacon_count, list(event_uid) as event_uids, min(event_uid) as primary_event_uid FROM events WHERE dst_port IN (80, 443, 8080) AND action = 'ALLOW' GROUP BY src_ip, dst_ip, dst_port HAVING count(*) >= 25"

  - rule_id: "RULE-T1071-004"
    rule_name: "DNS Tunneling / High Volume DNS"
    rule_version: "1.0.0"
    technique_id: "T1071.004"
    technique_name: "DNS"
    severity: "HIGH"
    tactic: "Command and Control"
    description: "Unusual volume of DNS queries to the same destination port 53."
    query: "SELECT src_ip, dst_ip, count(*) as query_count, list(event_uid) as event_uids, min(event_uid) as primary_event_uid FROM events WHERE dst_port = 53 GROUP BY src_ip, dst_ip HAVING count(*) >= 30"

  - rule_id: "RULE-T1135-001"
    rule_name: "Network Share Discovery / DCERPC Enumeration"
    rule_version: "1.0.0"
    technique_id: "T1135"
    technique_name: "Network Share Discovery"
    severity: "MEDIUM"
    tactic: "Discovery"
    description: "Access to administrative or IPC shares (IPC$, ADMIN$, C$)."
    query: "SELECT event_uid, src_ip, dst_ip, user_name, event_type, extra FROM events WHERE extra LIKE '%IPC$%' OR extra LIKE '%ADMIN$%' OR extra LIKE '%C$%'"

  - rule_id: "RULE-T1110-003"
    rule_name: "SMB Password Spraying"
    rule_version: "1.0.0"
    technique_id: "T1110.003"
    technique_name: "Password Spraying"
    severity: "CRITICAL"
    tactic: "Credential Access"
    description: "Logon failures across multiple distinct users from SMB or network logon."
    query: "SELECT src_ip, count(DISTINCT user_name) as targeted_users, count(*) as fail_count, list(event_uid) as event_uids, min(event_uid) as primary_event_uid FROM events WHERE (outcome = 'FAILURE' OR extra LIKE '%4625%') AND user_name IS NOT NULL GROUP BY src_ip HAVING count(DISTINCT user_name) >= 2"

  - rule_id: "RULE-T1558-003"
    rule_name: "Kerberoasting Activity"
    rule_version: "1.0.0"
    technique_id: "T1558.003"
    technique_name: "Kerberoasting"
    severity: "HIGH"
    tactic: "Credential Access"
    description: "Kerberos ticket requests (Event 4769) using weak RC4-HMAC encryption (0x17)."
    query: "SELECT event_uid, host_name, user_name, src_ip, extra FROM events WHERE extra LIKE '%0x17%' AND (extra LIKE '%4769%' OR event_type = 'SECURITY_AUDIT')"

  - rule_id: "RULE-T1003-001"
    rule_name: "LSASS Memory Dump"
    rule_version: "1.0.0"
    technique_id: "T1003.001"
    technique_name: "LSASS Memory"
    severity: "CRITICAL"
    tactic: "Credential Access"
    description: "Evidence of memory dumping targeting LSASS process."
    query: "SELECT event_uid, host_name, user_name, extra FROM events WHERE extra LIKE '%mimikatz%' OR extra LIKE '%sekurlsa%' OR extra LIKE '%comsvcs.dll%' OR extra LIKE '%lsass%'"

  - rule_id: "RULE-T1505-003"
    rule_name: "Web Shell Activity"
    rule_version: "1.0.0"
    technique_id: "T1505.003"
    technique_name: "Web Shell"
    severity: "CRITICAL"
    tactic: "Persistence"
    description: "Web server processes (w3wp, httpd, nginx) spawning command shells."
    query: "SELECT event_uid, host_name, user_name, extra FROM events WHERE (extra LIKE '%w3wp.exe%' OR extra LIKE '%nginx%' OR extra LIKE '%httpd%') AND (extra LIKE '%cmd.exe%' OR extra LIKE '%powershell%')"

  - rule_id: "RULE-T1059-001"
    rule_name: "PowerShell Suspicious Execution"
    rule_version: "1.0.0"
    technique_id: "T1059.001"
    technique_name: "PowerShell"
    severity: "HIGH"
    tactic: "Execution"
    description: "PowerShell execution with base64 encoded command or bypass flags."
    query: "SELECT event_uid, host_name, user_name, extra FROM events WHERE extra LIKE '%powershell%' AND (extra LIKE '%-enc%' OR extra LIKE '%-EncodedCommand%' OR extra LIKE '%-ExecutionPolicy Bypass%')"

  - rule_id: "RULE-T1569-002"
    rule_name: "Remote Service Execution"
    rule_version: "1.0.0"
    technique_id: "T1569.002"
    technique_name: "Service Execution"
    severity: "HIGH"
    tactic: "Execution"
    description: "Service creation or execution events indicative of remote service invocation (e.g. PsExec, Event 7045)."
    query: "SELECT event_uid, host_name, user_name, extra FROM events WHERE extra LIKE '%7045%' OR extra LIKE '%PSEXESVC%' OR extra LIKE '%SERVICE_START%'"

  - rule_id: "RULE-T1070-001"
    rule_name: "Clear Windows Event Logs"
    rule_version: "1.0.0"
    technique_id: "T1070.001"
    technique_name: "Clear Windows Event Logs"
    severity: "HIGH"
    tactic: "Defense Evasion"
    description: "Audit log clear events (Event 1102) or wevtutil command invocations."
    query: "SELECT event_uid, host_name, user_name, extra FROM events WHERE extra LIKE '%1102%' OR extra LIKE '%wevtutil%cl%'"

  - rule_id: "RULE-T1136-001"
    rule_name: "Local User Account Created"
    rule_version: "1.0.0"
    technique_id: "T1136.001"
    technique_name: "Local Account"
    severity: "MEDIUM"
    tactic: "Persistence"
    description: "New user account created (Event 4720)."
    query: "SELECT event_uid, host_name, user_name, extra FROM events WHERE extra LIKE '%4720%' OR extra LIKE '%ACCOUNT_CREATED%'"

  - rule_id: "RULE-T1021-002"
    rule_name: "SMB/Windows Admin Shares Lateral Movement"
    rule_version: "1.0.0"
    technique_id: "T1021.002"
    technique_name: "SMB/Windows Admin Shares"
    severity: "HIGH"
    tactic: "Lateral Movement"
    description: "Direct connection to network shares on destination host."
    query: "SELECT event_uid, host_name, src_ip, dst_ip, extra FROM events WHERE dst_port = 445 AND action = 'ALLOW'"

  - rule_id: "RULE-T1048-002"
    rule_name: "Data Exfiltration Over Non-Standard Port"
    rule_version: "1.0.0"
    technique_id: "T1048.002"
    technique_name: "Exfiltration Over Asymmetric Encrypted Non-C2 Protocol"
    severity: "HIGH"
    tactic: "Exfiltration"
    description: "High volume connections to unusual outbound ports."
    query: "SELECT src_ip, dst_ip, dst_port, count(*) as conn_count, list(event_uid) as event_uids, min(event_uid) as primary_event_uid FROM events WHERE dst_port NOT IN (80, 443, 53, 22, 123) AND action = 'ALLOW' GROUP BY src_ip, dst_ip, dst_port HAVING count(*) >= 15"
