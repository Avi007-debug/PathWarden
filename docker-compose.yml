version: "3.8"

services:
  # PathWarden Backend - FastAPI, DuckDB & Correlation Pipeline
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pathwarden-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=qwen2.5-coder:1.5b
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/backend/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # PathWarden Frontend - Next.js 15 Brutalist SOC Console
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pathwarden-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: pathwarden-network

